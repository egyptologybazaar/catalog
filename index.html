<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AHM Bazaar | Official UK Product Catalog</title>
  <meta name="description" content="AHM Bazaar – Egyptian handcrafted statues and artifacts. Browse the UK catalog and order via WhatsApp.">
  <meta property="og:title" content="AHM Bazaar | Egyptian Handcrafted Collection">
  <meta property="og:description" content="Browse our UK catalog of handcrafted Egyptian statues and order via WhatsApp.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>𓂀</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8f6f2; --card: #ffffff; --dark: #1c1917; --gold: #b48a3e;
      --green: #16a34a; --green-hover: #15803d; --text: #292524;
      --muted: #78716c; --border: #e7e5e4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Plus Jakarta Sans', sans-serif; background: var(--bg); color: var(--text); padding-bottom: 95px; }
    header { background: var(--dark); color: #fff; padding: 18px 24px; position: sticky; top: 0; z-index: 40; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .header-inner { max-width: 1320px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; }
    .brand { font-family: 'Cinzel', serif; font-size: 1.55rem; letter-spacing: 1.5px; color: #f5d799; }
    .brand span { display: block; font-family: 'Plus Jakarta Sans', sans-serif; font-size: 0.72rem; letter-spacing: 2px; color: #a8a29e; text-transform: uppercase; }
    .controls { display: flex; gap: 10px; flex: 1; max-width: 680px; flex-wrap: wrap; }
    .controls input, .controls select { padding: 10px 14px; border-radius: 8px; border: 1px solid #44403c; background: #292524; color: #fff; font-size: 0.9rem; outline: none; }
    .controls input { flex: 1; min-width: 200px; }
    .controls input::placeholder { color: #a8a29e; }
    .container { max-width: 1320px; margin: 28px auto; padding: 0 20px; }
    .stats-bar { display: flex; flex-wrap: wrap; gap: 8px; justify-content: space-between; align-items: center; margin-bottom: 18px; font-size: 0.88rem; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 24px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; display: flex; flex-direction: column; transition: transform 0.2s, box-shadow 0.2s; }
    .card:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,0.08); }
    .img-wrap { position: relative; background: #141414; aspect-ratio: 1 / 1; cursor: pointer; overflow: hidden; }
    .img-wrap img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s; }
    .card:hover .img-wrap img { transform: scale(1.03); }
    .sku-badge { position: absolute; top: 12px; left: 12px; background: rgba(28, 25, 23, 0.92); color: #f5d799; border: 1px solid var(--gold); padding: 5px 10px; border-radius: 6px; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px; }
    .thumbs { display: flex; gap: 6px; padding: 10px 14px 0; overflow-x: auto; }
    .thumbs img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; border: 2px solid transparent; cursor: pointer; background: #141414; flex-shrink: 0; }
    .thumbs img.active { border-color: var(--gold); }
    .card-body { padding: 14px 16px 16px; display: flex; flex-direction: column; flex: 1; }
    .title { font-size: 1.02rem; font-weight: 700; margin-bottom: 8px; line-height: 1.35; }
    .meta { font-size: 0.84rem; color: var(--muted); margin-bottom: 4px; }
    .price { font-size: 1.2rem; font-weight: 700; color: var(--dark); margin: 10px 0 14px; }
    .price.poa { font-size: 0.95rem; color: var(--gold); }
    .btn-add { margin-top: auto; width: 100%; padding: 11px; border: none; border-radius: 8px; background: var(--dark); color: #fff; font-weight: 600; font-size: 0.85rem; letter-spacing: 0.5px; cursor: pointer; transition: background 0.2s; }
    .btn-add:hover { background: var(--gold); }
    .btn-add.added { background: var(--green); }
    .cart-bar { position: fixed; bottom: 18px; right: 20px; left: 20px; max-width: 600px; margin: 0 auto; background: var(--dark); color: #fff; padding: 14px 20px; border-radius: 14px; display: none; align-items: center; justify-content: space-between; gap: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.28); z-index: 50; }
    .cart-bar.visible { display: flex; }
    .btn-wa { background: var(--green); color: #fff; border: none; padding: 10px 16px; border-radius: 8px; font-weight: 700; font-size: 0.85rem; cursor: pointer; }
    .btn-wa:hover { background: var(--green-hover); }
    .btn-clear { background: #44403c; color: #fff; border: none; padding: 10px 12px; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
    .wa-float { position: fixed; right: 20px; bottom: 20px; width: 56px; height: 56px; border-radius: 50%; background: #25d366; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 18px rgba(0,0,0,0.25); z-index: 45; }
    body.has-cart .wa-float { display: none; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.84); z-index: 60; align-items: center; justify-content: center; padding: 20px; }
    .modal.open { display: flex; }
    .modal-box { background: #fff; border-radius: 16px; max-width: 860px; width: 100%; overflow: hidden; display: grid; grid-template-columns: 1.2fr 1fr; }
    @media (max-width: 700px) {
      .modal-box { grid-template-columns: 1fr; max-height: 90vh; overflow-y: auto; }
      .btn-wa { padding: 10px 12px; font-size: 0.78rem; }
    }
    .modal-img { background: #141414; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
    .modal-img img#modalMain { max-height: 420px; width: 100%; object-fit: contain; }
    .modal-info { padding: 24px; display: flex; flex-direction: column; }
    .close-btn { align-self: flex-end; background: none; border: none; font-size: 1.6rem; cursor: pointer; color: var(--muted); }
    .loader { text-align: center; padding: 60px 20px; color: var(--muted); }
    .error-box { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 16px 20px; border-radius: 10px; max-width: 650px; margin: 40px auto; text-align: center; line-height: 1.6; }
    footer { text-align: center; color: var(--muted); font-size: 0.8rem; padding: 30px 20px 10px; line-height: 1.7; }
    footer a { color: var(--gold); text-decoration: none; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="brand">AHM BAZAAR<span>Egyptian Handcrafted Collection</span></div>
    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search by Code (e.g. UK-042) or Name...">
      <select id="materialFilter"><option value="">All Materials</option></select>
      <select id="sortSelect">
        <option value="code">Sort: Code</option>
        <option value="price-asc">Price: Low → High</option>
        <option value="price-desc">Price: High → Low</option>
      </select>
    </div>
  </div>
</header>

<div class="container">
  <div class="stats-bar">
    <span id="itemCounter">Loading products...</span>
    <span>Tap any image to zoom &amp; view all angles</span>
  </div>
  <div id="statusMsg" class="loader">Loading AHM Bazaar Catalog...</div>
  <div id="grid" class="grid"></div>
</div>

<footer>
  AHM BAZAAR LTD · Registered in England &amp; Wales (No. 17495923)<br>
  <a href="mailto:o.arthubazaar@gmail.com">o.arthubazaar@gmail.com</a> ·
  <a href="https://wa.me/447717583790" target="_blank" rel="noopener">WhatsApp +44 7717 583790</a>
</footer>

<a class="wa-float" href="https://wa.me/447717583790" target="_blank" rel="noopener" aria-label="Chat on WhatsApp">
  <svg width="30" height="30" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.3 14.1c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-4-4.7-4.2-.1-.2-1.1-1.5-1.1-2.8s.7-2 1-2.3c.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 2c.1.2.1.3 0 .5l-.3.5-.4.4c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.1 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1c.2-.3.4-.2.6-.1l1.9.9c.3.1.5.2.5.3.1.2.1.7-.1 1.4z"/></svg>
</a>

<div id="cartBar" class="cart-bar">
  <div>
    <strong id="cartCount">0 Items</strong>
    <div style="font-size:0.8rem; color:#d6d3d1;" id="cartTotal"></div>
  </div>
  <div style="display:flex; gap:8px;">
    <button class="btn-clear" id="clearBtn">Clear</button>
    <button class="btn-wa" id="waBtn">ORDER VIA WHATSAPP</button>
  </div>
</div>

<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-img">
      <img id="modalMain" src="" alt="">
      <div id="modalThumbs" class="thumbs" style="margin-top:10px;"></div>
    </div>
    <div class="modal-info">
      <button class="close-btn" id="closeBtn" aria-label="Close">&times;</button>
      <div id="modalCode" style="color:var(--gold); font-weight:700; font-size:0.85rem; margin-bottom:6px;"></div>
      <h2 id="modalTitle" style="font-size:1.3rem; margin-bottom:12px;"></h2>
      <p class="meta" id="modalMat"></p>
      <p class="meta" id="modalDim"></p>
      <div class="price" id="modalPrice" style="font-size:1.4rem;"></div>
      <button id="modalAddBtn" class="btn-add">ADD TO ORDER</button>
    </div>
  </div>
</div>

<script>
  // ===== SETTINGS (edit here only) =====
  const SHEET_ID = "1KzALnczn-Gd-uTxwnlZrWjnbpWop3ADOzYLns3Z5Ob0";
  const SHEET_NAME = "Sheet1";
  const WHATSAPP_NUM = "447717583790";
  // =====================================

  const gbp = new Intl.NumberFormat('en-GB', { style: 'currency', currency: 'GBP' });
  let allProducts = [];
  let cart = {};
  let loaded = false;

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const imgUrl = (id, size) => "https://lh3.googleusercontent.com/d/" + id + "=w" + (size || 700);
  const priceText = p => p > 0 ? gbp.format(p) : 'Price on request';

  function showError(msg) {
    $('statusMsg').style.display = 'block';
    $('statusMsg').className = '';
    $('statusMsg').innerHTML = '<div class="error-box">' + msg + '</div>';
    $('itemCounter').textContent = '';
  }

  window.handleSheetResponse = function(response) {
    loaded = true;
    if (!response || response.status === 'error' || !response.table) {
      showError('<strong>Catalog temporarily unavailable.</strong><br>Please contact us on WhatsApp: +44 7717 583790');
      return;
    }

    allProducts = [];
    (response.table.rows || []).forEach(r => {
      const cells = r.c || [];
      const val = i => (cells[i] && cells[i].v != null) ? String(cells[i].v).trim() : '';
      const code = val(0).toUpperCase();
      const status = val(5).toLowerCase();
      const urlsRaw = val(6);
      if (!code || code === 'CODE' || status !== 'available' || !urlsRaw) return;

      const ids = urlsRaw.split(',')
        .map(u => { const m = u.trim().match(/\/d\/([a-zA-Z0-9_-]+)/) || u.trim().match(/[?&]id=([a-zA-Z0-9_-]+)/); return m ? m[1] : ''; })
        .filter(Boolean);
      if (!ids.length) return;

      const price = (cells[4] && typeof cells[4].v === 'number') ? cells[4].v : (parseFloat(val(4).replace(/[^0-9.]/g, '')) || 0);

      allProducts.push({
        code,
        title: val(1) || ('Egyptian Artifact ' + code),
        material: val(2) || 'Handcrafted Stone',
        dimensions: val(3) || 'Standard Size',
        price,
        ids
      });
    });

    if (!allProducts.length) {
      showError('No items are available right now. Please contact us on WhatsApp: +44 7717 583790');
      return;
    }

    $('statusMsg').style.display = 'none';
    const sel = $('materialFilter');
    [...new Set(allProducts.map(p => p.material))].sort().forEach(m => {
      const opt = document.createElement('option');
      opt.value = m; opt.textContent = m;
      sel.appendChild(opt);
    });
    filterProducts();
  };

  function renderGrid(list) {
    const grid = $('grid');
    $('itemCounter').textContent = `Showing ${list.length} available item(s)`;
    if (!list.length) {
      grid.innerHTML = '<p style="grid-column:1/-1; text-align:center; color:#78716c; padding:40px;">No available items match your search.</p>';
      return;
    }
    grid.innerHTML = list.map(p => {
      const c = esc(p.code);
      const thumbs = p.ids.length > 1
        ? `<div class="thumbs">${p.ids.map((id, i) => `<img src="${imgUrl(id, 150)}" loading="lazy" alt="" class="${i === 0 ? 'active' : ''}" data-thumb="${c}" data-id="${id}">`).join('')}</div>`
        : '';
      const inCart = !!cart[p.code];
      return `
        <div class="card">
          <div class="img-wrap" data-open="${c}">
            <span class="sku-badge">CODE: ${c}</span>
            <img id="main-${c}" src="${imgUrl(p.ids[0], 600)}" loading="lazy" alt="${esc(p.title)}">
          </div>
          ${thumbs}
          <div class="card-body">
            <div class="title">${esc(p.title)}</div>
            <div class="meta">Material: ${esc(p.material)}</div>
            <div class="meta">Dimensions: ${esc(p.dimensions)}</div>
            <div class="price ${p.price > 0 ? '' : 'poa'}">${priceText(p.price)}</div>
            <button class="btn-add ${inCart ? 'added' : ''}" data-cart="${c}">${inCart ? 'ADDED ✓' : 'ADD TO ORDER'}</button>
          </div>
        </div>`;
    }).join('');
  }

  function filterProducts() {
    const q = $('searchInput').value.toLowerCase().trim();
    const mat = $('materialFilter').value;
    const sort = $('sortSelect').value;
    const list = allProducts.filter(p =>
      (p.code.toLowerCase().includes(q) || p.title.toLowerCase().includes(q)) && (!mat || p.material === mat));
    list.sort((a, b) =>
      sort === 'price-asc' ? a.price - b.price :
      sort === 'price-desc' ? b.price - a.price :
      a.code.localeCompare(b.code, undefined, { numeric: true }));
    renderGrid(list);
  }

  function toggleCart(code) {
    const p = allProducts.find(x => x.code === code);
    if (!p) return;
    if (cart[code]) delete cart[code]; else cart[code] = p;
    updateCartUI();
  }

  function updateCartUI() {
    const items = Object.values(cart);
    $('cartBar').classList.toggle('visible', items.length > 0);
    document.body.classList.toggle('has-cart', items.length > 0);
    if (items.length) {
      const total = items.reduce((s, i) => s + i.price, 0);
      const poa = items.some(i => i.price <= 0);
      $('cartCount').textContent = `${items.length} item(s) selected`;
      $('cartTotal').textContent = `Estimated total: ${gbp.format(total)}${poa ? ' + items on request' : ''}`;
    }
    document.querySelectorAll('[data-cart]').forEach(btn => {
      const inCart = !!cart[btn.dataset.cart];
      btn.classList.toggle('added', inCart);
      btn.textContent = inCart ? 'ADDED ✓' : 'ADD TO ORDER';
    });
  }

  function openModal(code) {
    const p = allProducts.find(x => x.code === code);
    if (!p) return;
    $('modalMain').src = imgUrl(p.ids[0], 1000);
    $('modalMain').alt = p.title;
    $('modalCode').textContent = 'CODE: ' + p.code;
    $('modalTitle').textContent = p.title;
    $('modalMat').textContent = 'Material: ' + p.material;
    $('modalDim').textContent = 'Dimensions: ' + p.dimensions;
    $('modalPrice').textContent = priceText(p.price);
    $('modalThumbs').innerHTML = p.ids.map((id, i) =>
      `<img src="${imgUrl(id, 150)}" alt="" class="${i === 0 ? 'active' : ''}" data-modal-id="${id}">`).join('');
    const btn = $('modalAddBtn');
    btn.textContent = cart[code] ? 'REMOVE FROM ORDER' : 'ADD TO ORDER';
    btn.className = 'btn-add ' + (cart[code] ? 'added' : '');
    btn.onclick = () => { toggleCart(code); closeModal(); };
    $('modal').classList.add('open');
  }

  function closeModal() { $('modal').classList.remove('open'); }

  function sendWhatsApp() {
    const items = Object.values(cart);
    if (!items.length) return;
    let msg = "Hello AHM Bazaar, I would like to order / enquire about the following items:\n\n";
    items.forEach((it, i) => { msg += `${i + 1}. *${it.code}* - ${it.title} (${priceText(it.price)})\n`; });
    msg += `\n*Estimated Total:* ${gbp.format(items.reduce((s, i) => s + i.price, 0))}`;
    window.open(`https://wa.me/${WHATSAPP_NUM}?text=${encodeURIComponent(msg)}`, '_blank');
  }

  // Events
  $('searchInput').addEventListener('input', filterProducts);
  $('materialFilter').addEventListener('change', filterProducts);
  $('sortSelect').addEventListener('change', filterProducts);
  $('clearBtn').addEventListener('click', () => { cart = {}; updateCartUI(); });
  $('waBtn').addEventListener('click', sendWhatsApp);
  $('closeBtn').addEventListener('click', closeModal);
  $('modal').addEventListener('click', e => { if (e.target === $('modal')) closeModal(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

  $('grid').addEventListener('click', e => {
    const t = e.target;
    if (t.dataset.cart) return toggleCart(t.dataset.cart);
    if (t.dataset.thumb) {
      $('main-' + t.dataset.thumb).src = imgUrl(t.dataset.id, 600);
      t.parentElement.querySelectorAll('img').forEach(i => i.classList.remove('active'));
      t.classList.add('active');
      return;
    }
    const wrap = t.closest('[data-open]');
    if (wrap) openModal(wrap.dataset.open);
  });

  $('modalThumbs').addEventListener('click', e => {
    const id = e.target.dataset.modalId;
    if (!id) return;
    $('modalMain').src = imgUrl(id, 1000);
    $('modalThumbs').querySelectorAll('img').forEach(i => i.classList.remove('active'));
    e.target.classList.add('active');
  });

  // Load data from Google Sheets
  (function loadSheet() {
    const s = document.createElement('script');
    s.src = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=responseHandler:handleSheetResponse&sheet=${encodeURIComponent(SHEET_NAME)}&t=${Date.now()}`;
    s.onerror = () => showError('<strong>Could not load the catalog.</strong><br>Please check your connection or contact us on WhatsApp: +44 7717 583790');
    document.body.appendChild(s);
    setTimeout(() => { if (!loaded) showError('<strong>Catalog is taking too long to load.</strong><br>Please refresh, or contact us on WhatsApp: +44 7717 583790'); }, 15000);
  })();
</script>
</body>
</html>
